<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="UTF-8"><style>
*{box-sizing:border-box}body{margin:0;color:#172026;background:#f2f4f4;font-family:Arial,"Noto Sans JP",sans-serif}header{min-height:82px;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:#101619;border-bottom:3px solid #d9a514}header small{color:#d9a514;font-weight:800;letter-spacing:.16em}header h1{margin:4px 0 0;font-size:23px}.layout{max-width:1450px;margin:auto;padding:22px;display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{border:1px solid #dce1e2;border-radius:17px;background:#fff;box-shadow:0 8px 28px #1823280d}.sidebar{padding:14px;align-self:start;position:sticky;top:12px}.new{width:100%;min-height:44px;border:0;border-radius:11px;background:#d9a514;font-weight:900;cursor:pointer}.list{margin-top:14px;display:grid;gap:5px}.list button{padding:11px;border:1px solid transparent;border-radius:10px;text-align:left;background:transparent;cursor:pointer}.list button:hover,.list button.active{border-color:#e3c966;background:#faf6e6}.list strong,.list small{display:block}.list small{margin-top:3px;color:#758087}.editor{padding:28px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid #e4e8e9}.top h2{margin:0}.actions{display:flex;gap:8px}.actions button{min-height:42px;padding:0 16px;border-radius:10px;font-weight:900;cursor:pointer}.save{border:0;background:#d9a514}.delete{border:1px solid #e8bcbc;color:#9f3030;background:#fff7f7}.notice{display:none;margin:15px 0;padding:11px;border-radius:9px;background:#fff5c5}.url{margin-top:18px;padding:14px;border:1px solid #dce1e2;border-radius:11px;background:#f7f9f9;font:12px monospace;overflow-wrap:anywhere}.section{margin-top:25px;padding-top:20px;border-top:1px solid #e4e8e9}.section h3{margin:0 0 14px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:block}.wide{grid-column:1/-1}.field span{display:block;margin-bottom:6px;color:#566168;font-size:11px;font-weight:800}.field input,.field textarea{width:100%;min-height:41px;padding:9px 10px;border:1px solid #cbd2d5;border-radius:8px;background:#fff;color:#172026}.field textarea{min-height:90px;resize:vertical}.upload{padding:11px;border:1px solid #dfe4e5;border-radius:10px}.upload input[type=file]{margin-top:7px}.security{padding:13px;border-radius:10px;background:#f7f9f9}.social{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:11px;border-radius:10px;background:#f7f9f9}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:8px}.sidebar{position:static}.editor{padding:16px}.grid,.social{grid-template-columns:1fr}.wide,.social{grid-column:auto}.top{align-items:flex-start;gap:12px;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head><body>
<header><div><small>DIGITAL RIDER CARD</small><h1>名刺管理</h1></div><span id="account"></span></header>
<main class="layout"><aside class="panel sidebar"><button class="new" id="new">＋ 新しい名刺</button><div class="list" id="list"></div></aside><section class="panel editor"><div class="top"><h2 id="title">新しい名刺</h2><div class="actions"><button class="delete" id="delete" hidden>削除</button><button class="save" id="save">保存</button></div></div><p class="notice" id="notice"></p><div class="url" id="public-url">保存後に個別URLが発行されます</div><form id="form"></form></section></main>
<script>
const SOCIALS=[['instagram','Instagram'],['threads','Threads'],['x','X'],['youtube','YouTube'],['tiktok','TikTok'],['minkara','みんカラ'],['facebook','Facebook'],['line','LINE']];
const FIELDS=[['slug','URL ID（英数字）','text'],['name','名前 *','text'],['reading','英字表記','text'],['tagline','キャッチコピー','text'],['organization','所属','text'],['role','担当・肩書き','text'],['currentBike','現在のバイク','text'],['message','ひとこと（100文字以内）','textarea'],['pastBikes','PAST BIKES','textarea'],['rallyHistory','TOURING RALLY','textarea'],['phone','電話番号','text'],['email','メールアドレス','email'],['accentColor','アクセント色','color'],['gradient','背景グラデーション','text']];
const IMAGES=[['avatarUrl','丸アイコン'],['heroUrl','上部メイン写真'],['bikePhotoUrl','愛車写真'],['backgroundUrl','背景写真']];
let profiles=[],selected=null,base='';
const blank=()=>({slug:'',name:'',reading:'',tagline:'RIDE. CONNECT. CREATE.',organization:'',role:'Rider / Creator',currentBike:'',message:'',pastBikes:'',rallyHistory:'',phone:'',email:'',accentColor:'#d9a514',gradient:'linear-gradient(145deg,#090b10,#162b35,#8a6910)',avatarUrl:'',heroUrl:'',bikePhotoUrl:'',backgroundUrl:'',websites:[],socials:[],pinEnabled:false,pinCode:'',removePin:false});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fieldHtml([key,label,type]){const value=selected?.[key]||'';return `<label class="field ${type==='textarea'?'wide':''}"><span>${label}</span>${type==='textarea'?`<textarea name="${key}">${esc(value)}</textarea>`:`<input name="${key}" type="${type}" value="${esc(value)}">`}</label>`}
function render(){selected=selected||blank();document.getElementById('title').textContent=selected.name||'新しい名刺';document.getElementById('delete').hidden=!selected._existing;document.getElementById('public-url').textContent=selected.slug?`${base}?id=${selected.slug}`:'保存後に個別URLが発行されます';let html=`<section class="section"><h3>基本情報</h3><div class="grid">${FIELDS.map(fieldHtml).join('')}</div></section>`;html+=`<section class="section"><h3>Webページ</h3><div class="grid"><label class="field"><span>Webページ名</span><input name="websiteLabel" value="${esc(selected.websites?.[0]?.label||'')}"></label><label class="field"><span>WebページURL</span><input name="websiteUrl" value="${esc(selected.websites?.[0]?.url||'')}"></label></div></section>`;html+=`<section class="section"><h3>画像</h3><div class="grid">${IMAGES.map(([key,label])=>`<div class="upload"><label class="field"><span>${label} URL</span><input name="${key}" value="${esc(selected[key]||'')}"></label><input type="file" accept="image/*" data-upload="${key}"></div>`).join('')}</div></section>`;html+=`<section class="section"><h3>セキュリティ</h3><div class="security"><label class="field"><span>4桁のPINコード</span><input name="pinCode" type="password" maxlength="4" inputmode="numeric" placeholder="${selected.pinEnabled?'変更する場合のみ入力':'未入力ならPIN認証なし'}"></label>${selected.pinEnabled?'<label><input name="removePin" type="checkbox"> PIN認証を解除する</label>':''}</div></section>`;html+=`<section class="section"><h3>SNS</h3><div class="grid">${SOCIALS.map(([kind,label])=>{const s=selected.socials?.find(x=>x.kind===kind)||{};return `<div class="social"><label class="field"><span>${label} 表示名</span><input data-social="${kind}" data-key="handle" value="${esc(s.handle||'')}"></label><label class="field"><span>${label} URL</span><input data-social="${kind}" data-key="url" value="${esc(s.url||'')}"></label></div>`}).join('')}</div></section>`;document.getElementById('form').innerHTML=html;document.querySelectorAll('[data-upload]').forEach(input=>input.onchange=()=>upload(input));renderList();}
function renderList(){document.getElementById('list').innerHTML=profiles.map(p=>`<button data-id="${esc(p.slug)}" class="${selected?._existing&&p.slug===selected.slug?'active':''}"><strong>${esc(p.name)}</strong><small>/${esc(p.slug)}${p.pinEnabled?'・PIN':''}</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=profiles.find(x=>x.slug===b.dataset.id);selected=JSON.parse(JSON.stringify({...p,_existing:true,pinCode:'',removePin:false}));render()})}
function collect(){const fd=new FormData(document.getElementById('form'));const p={...selected};FIELDS.forEach(([k])=>p[k]=String(fd.get(k)||''));IMAGES.forEach(([k])=>p[k]=String(fd.get(k)||''));p.websites=fd.get('websiteLabel')&&fd.get('websiteUrl')?[{label:String(fd.get('websiteLabel')),url:String(fd.get('websiteUrl'))}]:[];p.socials=SOCIALS.flatMap(([kind])=>{const h=document.querySelector(`[data-social="${kind}"][data-key="handle"]`).value.trim(),u=document.querySelector(`[data-social="${kind}"][data-key="url"]`).value.trim();return h&&u?[{kind,handle:h,url:u}]:[]});p.pinCode=String(fd.get('pinCode')||'').replace(/\D/g,'').slice(0,4);p.removePin=fd.get('removePin')==='on';return p}
function notice(msg,bad=false){const n=document.getElementById('notice');n.style.display='block';n.style.background=bad?'#ffe0e0':'#fff5c5';n.textContent=msg}
function save(){const p=collect();document.getElementById('save').disabled=true;google.script.run.withSuccessHandler(saved=>{const old=selected._existing?selected.slug:null;profiles=profiles.filter(x=>x.slug!==old&&x.slug!==saved.slug);profiles.unshift(saved);selected={...saved,_existing:true,pinCode:'',removePin:false};document.getElementById('save').disabled=false;notice('保存しました。');render()}).withFailureHandler(e=>{document.getElementById('save').disabled=false;notice(e.message||String(e),true)}).adminSaveProfile(p,selected._existing?selected.slug:'')}
function remove(){if(!selected._existing||!confirm(`「${selected.name}」を削除しますか？`))return;google.script.run.withSuccessHandler(()=>{profiles=profiles.filter(x=>x.slug!==selected.slug);selected=blank();notice('削除しました。');render()}).withFailureHandler(e=>notice(e.message||String(e),true)).adminDeleteProfile(selected.slug)}
function upload(input){const file=input.files?.[0];if(!file)return;notice('画像をアップロードしています…');const reader=new FileReader();reader.onload=()=>{const base64=String(reader.result).split(',')[1];google.script.run.withSuccessHandler(url=>{selected[input.dataset.upload]=url;notice('画像を登録しました。保存ボタンを押してください。');render()}).withFailureHandler(e=>notice(e.message||String(e),true)).adminUploadImage(base64,file.name,file.type)};reader.readAsDataURL(file)}
document.getElementById('new').onclick=()=>{selected=blank();render()};document.getElementById('save').onclick=save;document.getElementById('delete').onclick=remove;
google.script.run.withSuccessHandler(data=>{profiles=data.profiles||[];base=data.publicBaseUrl;document.getElementById('account').textContent=data.adminEmail;selected=blank();render()}).withFailureHandler(e=>notice(e.message||String(e),true)).adminBootstrap();
</script></body></html>
